{% extends 'base.html' %}

{% block title %}Log In - ECCD System{% endblock %}

{% block extra_css %}
<style>
    main.container {
        max-width: 100% !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    .auth-wrapper {
        min-height: calc(100vh - 76px);
        background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        padding: 4rem 0;
    }
    .blob {
        position: absolute;
        filter: blur(80px);
        z-index: 0;
        border-radius: 50%;
        animation: pulse-soft 8s infinite alternate;
    }
    .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: rgba(134, 239, 172, 0.4); }
    .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: rgba(147, 197, 253, 0.4); }
    
    @keyframes pulse-soft {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper w-100">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="container position-relative z-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="bg-success bg-gradient p-4 text-center text-white">
                <div class="mb-3 mt-2">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white text-success rounded-circle shadow-sm" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-white-50 mb-2">Sign in to your ECCD account</p>
            </div>
            
            <div class="p-4 p-md-5 bg-white">
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-4">
                        <label for="login_identity" class="form-label text-dark fw-semibold">Username or Email</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0" id="login_identity" name="login_identity" placeholder="Enter username or email" value="{{ login_identity or '' }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-dark fw-semibold">Password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    
                    <div class="mb-4 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                        </div>
                        <a href="{{ url_for('auth.forgot_password') }}" class="small text-success fw-semibold text-decoration-none hover-dark">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm">
                        Log In
                    </button>
                </form>
                
                <div class="text-center mt-5">
                    <p class="text-secondary mb-3 small">Don't have an account?</p>
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                        <a href="{{ url_for('auth.register_teacher') }}" class="btn btn-outline-primary rounded-pill btn-sm px-4 py-2 fw-semibold">
                            <i class="bi bi-person-workspace me-1"></i> I'm an Educator
                        </a>
                        <a href="{{ url_for('auth.register_parent') }}" class="btn btn-outline-success rounded-pill btn-sm px-4 py-2 fw-semibold">
                            <i class="bi bi-people me-1"></i> I'm a Parent
                        </a>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
