{% extends 'base.html' %}

{% block title %}Login - ECCD System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-success fs-1"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted">Sign in to manage or monitor development</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <!-- Username or Email -->
                <div class="mb-3">
                    <label for="login_identity" class="form-label fw-semibold">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0" id="login_identity" name="login_identity" placeholder="Enter username or email" value="{{ login_identity or '' }}" required>
                    </div>
                </div>
                
                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me</label>
                    </div>
                    <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">Forgot Password?</a>
                </div>
                
                <!-- Submit -->
                <button type="submit" class="btn btn-success w-100 py-2.5 mb-3 text-white fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                </button>
            </form>
            
            <hr class="my-4 text-muted">
            
            <div class="text-center">
                <p class="text-muted mb-2">Don't have an account yet?</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('auth.register_teacher') }}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-person-workspace"></i> As Teacher
                    </a>
                    <a href="{{ url_for('auth.register_parent') }}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-people-fill"></i> As Parent
                    </a>
                </div>
                <div class="mt-3">
                    <a href="{{ url_for('main.landing') }}" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
